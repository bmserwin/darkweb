# Local-only compose overrides. Not committed: adjust to your host.
# 1. Host port 18080 replaces 8080 for the mock onion because something else
#    already listens on 8080 on this machine. The container port is unchanged,
#    so the backend's internal URL (http://mock-onion:8080) is unaffected.
# 2. The network alias lets the infra prober resolve the simulated .onion
#    hostname inside the compose network, so a TLS probe dials the right
#    container with matching SNI + certificate name.
services:
  mock-onion:
    # Run the module entrypoint so BOTH listeners come up (HTTP 8080 + TLS
    # 8443). The base file's uvicorn command serves plain HTTP only.
    command: ["python", "mock_onion_server.py"]
    ports: !override
      - "18080:8080"
      - "8443:8443"
    networks:
      default:
        aliases:
          - vmijjgu6ydy75cxmbj5p2ey42d7wsab6u4plz5m2kza3xkgqbnrsfktj.onion

  backend:
    volumes:
      - ./backend/data:/app/data
      - ./simulation/certs:/app/certs:ro

  mock-clearnet:
    command: ["python", "mock_clearnet_server.py"]
    networks:
      default:
        aliases:
          - staging.northgate-hosting.example
